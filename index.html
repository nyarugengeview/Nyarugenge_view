<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#e6ddcd">
    <meta name="description" content="An open platform for useful statistics, interactive maps, and spatial insights about Nyarugenge District.">
    <title>Nyarugenge View</title>
    <link rel="icon" type="image/png" sizes="16x16" href="./public/images/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="./public/images/favicon-32x32.png">
    <link rel="icon" href="./public/images/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" sizes="180x180" href="./public/images/apple-touch-icon.png">
    <link rel="manifest" href="./public/site.webmanifest">
    <style>
      :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #27243d; background: #e6ddcd; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 2rem 1.25rem; }
      main { width: min(100%, 760px); text-align: center; }
      .logo { display: block; width: min(100%, 420px); height: auto; margin: 0 auto 2rem; }
      h1 { margin: 0; font-size: clamp(1.8rem, 5vw, 3rem); font-weight: 600; letter-spacing: -.035em; }
      p { max-width: 620px; margin: 1rem auto 0; color: #544f49; font-size: clamp(1rem, 2.5vw, 1.2rem); line-height: 1.7; }
      footer { margin-top: 3rem; color: #6a6258; font-size: .9rem; }
    </style>
  </head>
  <body>
    <main>
      <img class="logo" src="./public/images/nyarugenge-view-logo.png" alt="Nyarugenge View">
      <h1>See Nyarugenge with a clearer view.</h1>
      <p>An open platform turning official data into useful statistics, interactive maps, and spatial insights to support people and evidence-based planning across Nyarugenge District.</p>
      <footer>Useful data. Better understanding. Sustainable urban development.</footer>
    </main>
  </body>
</html>
